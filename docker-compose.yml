services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8090
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3345
      - DB_DATABASE=myproject
      - DB_USERNAME=myproject
      - DB_PASSWORD=myproject
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=sync
      - BROADCAST_CONNECTION=reverb
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=myproject-app
      - REVERB_APP_KEY=myproject-key
      - REVERB_APP_SECRET=myproject-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=reverb
      - REVERB_SERVER_PORT=8081
      - VITE_REVERB_HOST=0.0.0.0
      - VITE_REVERB_PORT=8081
      - VITE_REVERB_SCHEME=http
      - VITE_REVERB_APP_KEY=myproject-key
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_public_uploads:/app/public/uploads

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8090
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3345
      - DB_DATABASE=myproject
      - DB_USERNAME=myproject
      - DB_PASSWORD=myproject
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=sync
      - BROADCAST_CONNECTION=reverb
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=myproject-app
      - REVERB_APP_KEY=myproject-key
      - REVERB_APP_SECRET=myproject-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=reverb
      - REVERB_SERVER_PORT=8081
    depends_on:
      db:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3307:3345"
    environment:
      MYSQL_DATABASE: myproject
      MYSQL_USER: myproject
      MYSQL_PASSWORD: myproject
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  app_storage:
  app_public_uploads:
  kafka_data:
